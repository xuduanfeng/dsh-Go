# Compiles the whole app for HarmonyOS arm64 up to libapp.so on a macOS runner,
# where oh-flutter publishes its AOT tools (app/ohos/README.md). Needs no secrets:
# packaging and signing a HAP is a later job, once Command Line Tools and a
# signing profile exist.
#
# 2026-11-28: a `gate` job now compares the AOT inputs against the last successful
# run. When nothing that reaches app.so or flutter_assets changed (docs, tests,
# workflow edits, native-only commits), the macOS compile is skipped and the
# previous artifact is re-uploaded under the current sha, so `ohos-aot-<sha>`
# always exists for the local packaging scripts.
name: OHOS compile

# On main it runs after a merge, not on pull requests, so no PR waits for the macOS runner;
# a change to the shared app that breaks the HarmonyOS build shows up on main's run.
on:
  push:
    branches: [main, 'claude/harmonyos-ohos', 'ohos/**']
    paths:
      - 'app/**'
      - 'packages/**'
      - 'tooling/ohos/**'
      - '.github/workflows/ohos-compile.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ohos-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether the macOS compile is worth it, before touching the macOS pool.
  gate:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
      base_run: ${{ steps.decide.outputs.base_run }}
      base_sha: ${{ steps.decide.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compare AOT inputs with the last successful run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Fail open: anything unexpected means "compile", never a silent skip.
          needed=true
          base_run=""
          base_sha=""

          # Prefer the same branch; fall back to any branch (the app tree is shared).
          runs_of() {
            gh api --method GET \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ohos-compile.yml/runs" \
              "$@" -f status=success -f per_page=10 \
              --jq '.workflow_runs[] | [.id, .head_sha] | @tsv' 2>/dev/null || true
          }
          rows="$(runs_of -f branch="$GITHUB_REF_NAME")"
          if [ -z "$rows" ]; then
            rows="$(runs_of)"
          fi

          while IFS=$'\t' read -r id sha; do
            [ -n "${id:-}" ] || continue
            hit="$(gh api \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" 2>/dev/null \
              | jq --arg n "ohos-aot-$sha" \
                  '[.artifacts[] | select(.name == $n and .expired == false)] | length' \
                  2>/dev/null || echo 0)"
            if [ "${hit:-0}" != "0" ]; then
              base_run="$id"
              base_sha="$sha"
              break
            fi
          done <<< "$rows"

          if [ -n "$base_sha" ]; then
            # Shallow clone: bring the base commit's tree in on demand.
            if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
              git fetch --quiet --depth=1 origin "$base_sha" 2>/dev/null || true
            fi
            # Everything below feeds app.so or flutter_assets. The three excluded
            # asset trees are not declared in app/pubspec.yaml and never reach the
            # bundle (they are inputs to the icon/tile generators, whose outputs
            # live in app/ohos or app/lib and do count above).
            if git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
              if git diff --quiet "$base_sha" HEAD -- \
                  app/lib \
                  app/assets \
                  app/pubspec.yaml \
                  app/pubspec.lock \
                  app/ohos/pubspec_overrides.ohos.yaml \
                  packages \
                  tooling/ohos/patch_framework.py \
                  tooling/ohos/vendor_platform_switches.py \
                  ':(exclude)app/assets/brand' \
                  ':(exclude)app/assets/tiles/duotone' \
                  ':(exclude)app/assets/tiles/geometric'; then
                needed=false
              fi
            else
              echo "base commit $base_sha is not in this clone; compiling"
            fi
          else
            echo "no successful run with a live artifact; compiling"
          fi

          echo "needed=$needed"     >> "$GITHUB_OUTPUT"
          echo "base_run=$base_run" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "decision: needed=$needed base=${base_sha:-none}"

  # The inputs did not change: republish the previous artifact under today's sha,
  # so tooling/ohos/aot-ensure.sh and the local packaging chain keep finding
  # ohos-aot-<sha>. Costs ~30 s on ubuntu instead of 10–30 min on macOS.
  reuse:
    needs: gate
    if: needs.gate.outputs.needed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Download the previous artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ needs.gate.outputs.base_run }}" \
            -n "ohos-aot-${{ needs.gate.outputs.base_sha }}" \
            -D "$GITHUB_WORKSPACE"

      - name: Keep the compiled app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ohos-aot-${{ github.sha }}
          path: app/build/ohos-aot
          if-no-files-found: error
          retention-days: 14

  compile:
    needs: gate
    if: needs.gate.outputs.needed == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      FLUTTER_OHOS_TAG: 3.47.9-ohos-1.0.0
      FLUTTER_OHOS_COMMIT: e5f752df3e25ec897da3c98a74bcced7c21b0bd3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # oh-flutter comes from atomgit, its tools from Huawei's OBS and the OHOS plugins
      # from gitcode, and each of them drops connections from GitHub's runners now and
      # then (three failed runs in a row on 2026-11-06). Cached, a run fetches none of
      # them; when it has to, it tries five times a minute apart. A branch reads its own
      # cache and main's, so a new ohos/ branch fetches only while main has none, and a
      # runner's DNS failure can outlast a minute (2026-11-15, twice).
      - name: Restore oh-flutter
        id: sdk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flutter-ohos
          key: flutter-ohos-${{ env.FLUTTER_OHOS_COMMIT }}-${{ hashFiles('tooling/ohos/patch_framework.py') }}

      - name: Install oh-flutter
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            rm -rf ~/flutter-ohos
            git clone --depth 1 --branch "$FLUTTER_OHOS_TAG" https://atomgit.com/oh-flutter/flutter_flutter.git ~/flutter-ohos && break
            [ "$attempt" = 5 ] && exit 1
            sleep 60
          done

      - name: Put oh-flutter on the path
        run: |
          test "$(git -C ~/flutter-ohos rev-parse HEAD)" = "$FLUTTER_OHOS_COMMIT"
          echo "$HOME/flutter-ohos/bin" >> "$GITHUB_PATH"

      - name: Patch the framework's HarmonyOS branches
        run: python3 tooling/ohos/patch_framework.py ~/flutter-ohos

      - name: Fetch the SDK's own tools
        run: |
          flutter --version
          for attempt in 1 2 3 4 5; do
            flutter precache --ohos && break
            [ "$attempt" = 5 ] && exit 1
            sleep 60
          done

      - name: Save oh-flutter
        if: steps.sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flutter-ohos
          key: ${{ steps.sdk.outputs.cache-primary-key }}

      - name: Restore the pub cache
        id: pub
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ohos-pub-${{ env.FLUTTER_OHOS_COMMIT }}-${{ hashFiles('app/pubspec.lock', 'app/ohos/pubspec_overrides.ohos.yaml', 'packages/*/pubspec.yaml') }}
          restore-keys: ohos-pub-${{ env.FLUTTER_OHOS_COMMIT }}-

      # dart pub, not flutter pub: the latter goes on to refresh the ohos project,
      # which needs the HarmonyOS SDK this job does without.
      - name: Resolve dependencies with the OHOS plugins
        working-directory: app
        run: |
          get() {
            for attempt in 1 2 3; do
              dart pub get && return
              [ "$attempt" = 3 ] && return 1
              sleep 20
            done
          }
          cp ohos/pubspec_overrides.ohos.yaml pubspec_overrides.yaml
          get
          python3 ../tooling/ohos/vendor_platform_switches.py
          get

      - name: Save the pub cache
        if: steps.pub.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub.outputs.cache-primary-key }}

      # No icon tree shaking: oh-flutter's const_finder snapshot fails on its own Dart
      # with "Invalid SDK hash".
      - name: Compile to libapp.so
        working-directory: app
        run: |
          # dDartDefines is ENABLE_FLEX_OVERFLOW=false in base64, see tooling/ohos/build-hap.sh.
          flutter assemble \
            -dTargetPlatform=ohos-arm64 \
            -dBuildMode=release \
            -dTargetFile=lib/main.dart \
            -dTreeShakeIcons=false \
            -dDartDefines=RU5BQkxFX0ZMRVhfT1ZFUkZMT1c9ZmFsc2U= \
            --output=build/ohos-aot \
            ohos_aot_bundle_release_ohos-arm64

      - name: Report the result
        working-directory: app
        run: |
          find build/ohos-aot -maxdepth 2 | head -20
          lib="$(find build/ohos-aot .dart_tool/flutter_build \( -name app.so -o -name libapp.so \) | head -1)"
          test -n "$lib"
          file "$lib"
          echo "$(basename "$lib"): $(wc -c < "$lib") bytes" >> "$GITHUB_STEP_SUMMARY"
          wc -c "$lib"

      # The Dart half of a HAP. tooling/ohos/check-arkts.sh --full packages it with
      # the native libraries, which are cross-compiled on Linux.
      - name: Keep the compiled app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ohos-aot-${{ github.sha }}
          path: app/build/ohos-aot
          if-no-files-found: error
          retention-days: 14
